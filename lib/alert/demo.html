<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="my-alert.css">
</head>
<body>
    <button id="btnConfirm">Testar Confirm</button>
    <button id="btnPrompt">Testar Prompt</button>
    
    <script src="my-alert.js"></script>
    <script>
        // Confirm OK/Cancel
        document.getElementById('btnConfirm').addEventListener('click', async () => {
            console.log('🔄 Iniciando...');
            
            const ok = await myAlert.confirm('Clique OK ou Cancelar');
            
            if (ok) {
                console.log('✅ Usuário CONFIRMOU!');
                await myAlert.alert('Você confirmou!');
            } else {
                console.log('❌ Usuário CANCELou!');
                await myAlert.alert('Você cancelou!');
            }
        });

        // Prompt com valor
        document.getElementById('btnPrompt').addEventListener('click', async () => {
            const texto = await myAlert.prompt('Digite qualquer coisa:');
            
            if (texto !== null) {
                console.log('✅ Digitou:', `"${texto}"`);
            } else {
                console.log('❌ Cancelou prompt!');
            }
        });
    </script>
</body>
</html>
