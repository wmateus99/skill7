<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Skill7 | Portal de Habilidades</title>
        <link rel="shortcut icon" href="/assets/logo.svg" type="image/x-icon">

        <!-- Style -->
        <link rel="stylesheet" href="/styles/sty-frame.css">
        <link rel="stylesheet" href="/styles/main.css">

        <!-- Script global (se você usar em todas as páginas) -->
        <script type="module" src="/scripts/main.js" defer></script>

        <!-- RemixIcon -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="control">
            <button>-</button>
            <button>+</button>
        </div>
        <main>
            <iframe id="pdf-frame" src="" width="100%" height="100%" frameborder="0"></iframe>
        </main>

        <script>
            (function () {
                const params = new URLSearchParams(window.location.search);
                const file = params.get('file'); // ex: /arquivos/atividade-123.pdf

                const iframe = document.getElementById('pdf-frame');

                if (file) {
                    iframe.src = file;
                } else {
                    iframe.src = '';
                }
            })();
        </script>
    </body>
</html>
