<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Escolar - SQLite</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        form { margin-bottom: 20px; }
        input { margin: 5px 0; padding: 8px; width: 100%; display: block; }
        button { padding: 10px; background: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background: #218838; }
        ul { list-style: none; padding: 0; }
        li { background: #eee; margin: 5px 0; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Cadastro de Alunos</h1>
    
    <form id="formAluno">
        <input type="text" id="nome" placeholder="Nome Completo" required>
        <input type="text" id="usuario" placeholder="Nome de Usuário" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button type="submit">Cadastrar Aluno</button>
    </form>

    <hr>

    <h2>Lista de Alunos</h2>
    <ul id="listaAlunos">
        </ul>
</div>

<script>
    const form = document.getElementById('formAluno');
    const lista = document.getElementById('listaAlunos');

    // Função para buscar alunos do Banco de Dados
    async function carregarAlunos() {
        const resposta = await fetch('/alunos');
        const alunos = await resposta.json();
        
        lista.innerHTML = ''; // Limpa a lista antes de carregar
        alunos.forEach(aluno => {
            const li = document.createElement('li');
            li.textContent = `${aluno.nome} (@${aluno.usuario}) - Tipo: ${aluno.tipo}`;
            lista.appendChild(li);
        });
    }

    // Função para enviar novo aluno
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const novoAluno = {
            nome: document.getElementById('nome').value,
            usuario: document.getElementById('usuario').value,
            senha: document.getElementById('senha').value
        };

        const resposta = await fetch('/alunos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(novoAluno)
        });

        if (resposta.ok) {
            alert('Aluno cadastrado!');
            form.reset();
            carregarAlunos(); // Atualiza a lista na tela
        } else {
            alert('Erro ao cadastrar. Usuário já existe?');
        }
    });

    // Carregar a lista assim que abrir a página
    carregarAlunos();
</script>

</body>
</html>
