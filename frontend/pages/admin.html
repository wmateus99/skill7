<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill7 | Portal de Habilidades</title>
    <link rel="shortcut icon" href="/assets/logo.svg" type="image/x-icon">

    <!-- Style -->
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/sty-admin.css">

    <!-- Script -->
    <script src="/lib/alert/my-alert.js" defer></script>
    <script type="module" src="/scripts/main.js" defer></script>


    <!-- RemixIcon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
    <body>
        <div class="container">
            <div class="header">
                <h1>Admin Atividades</h1>
                <p>Gerencie suas atividades e materiais</p>
            </div>

            <div class="content">
                <div class="form-section">
                    <h2>Nova Atividade</h2>
                    <form id="formAtividade">
                        <div class="form-group">
                            <label for="titulo">Título da Atividade:</label>
                            <input type="text" id="titulo" required>
                        </div>

                        <div class="form-group">
                            <label for="modulo">Módulo:</label>
                            <select id="modulo" required>
                                <option value="">Selecione o módulo</option>
                                <option value="intro-infor">Introdução a Informática</option>
                                <option value="windows10">Windows 10</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="arquivo">Arquivo PDF:</label>
                            <input type="file" id="arquivo" accept=".pdf" required>
                        </div>

                        <button type="submit" class="btn">Cadastrar Atividade</button>
                    </form>
                </div>

                <div class="list-section">
                    <h2>Atividades Cadastradas</h2>
                    <div id="listaAtividades">
                        <div class="loading">Carregando atividades...</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="/scripts/admin.js"></script>
</html>
