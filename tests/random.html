<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/styles/main.css">
    <title>Document</title>
    <style>
        body {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .box {
            width: 750px;
            height: 550px;
            position: relative;
            transition: .3s ease-in-out;
        }
        .bola {
            transition: .3s ease;
            width: 50px;
            height: 50px;
            cursor: pointer;
            background: red;
            position: absolute;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="box block-21">
        <div class="bola"></div>
    </div>

<script>
    const bola = document.querySelector('.bola')
    
    bola.addEventListener('click', () => {
        let topBola = Math.floor(Math.random() * 550) + 1;
        let leftBola = Math.floor(Math.random() * 550) + 1;
        bola.style.top = `${topBola}px`;
        bola.style.left = `${leftBola}px`;
    })
</script>
</body>
</html>
