        <div class="container">
            <div class="filter">
                <form id="form-filtro">
                    <div class="box-option">
                        <input type="radio" name="modulo" value="introducao-informatica" id="introducao-informatica">

                        <input type="radio" name="modulo" value="windows10" id="windows10">

                    </div>
                    <div class="box-option">
                        <input type="radio" name="modulo" value="windows11" id="windows11" checked>

                    </div>
                    <div class="box-option">
                        <input type="radio" name="modulo" value="internet" id="internet">

                    <div class="box-option">

                    <div class="box-option">
                        <input type="radio" name="modulo" value="word" id="word">

                    </div>
                    <div class="box-option">
                        <input type="radio" name="modulo" value="excel-fast" id="excel-fast">

                    </div>
                    <div class="box-option">

                    <div class="box-option">
